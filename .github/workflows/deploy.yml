name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /severo_data
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          # IDs públicos (ya hardcodeados como fallback en el código) — nombres exactos que lee la app
          NEXT_PUBLIC_SHEET_RELEVAMIENTO_ID: 1qzLuz42e3GZ0yXf_z-wjpAQJP6rGsCVTgg-whZSt2UA
          NEXT_PUBLIC_SHEET_PADRON_ID: 1QjhmHFpwL9J7io10v2Ie31avOFrMK4oGYf_zHTi82Vg
          NEXT_PUBLIC_SHEET3_ID: 1QjhmHFpwL9J7io10v2Ie31avOFrMK4oGYf_zHTi82Vg
          NEXT_PUBLIC_ALLOWED_EMAILS: ${{ secrets.NEXT_PUBLIC_ALLOWED_EMAILS }}
          NEXT_PUBLIC_ALLOWED_DOMAIN: ${{ secrets.NEXT_PUBLIC_ALLOWED_DOMAIN }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
